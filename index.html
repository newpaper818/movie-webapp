<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Movie Reservation</title>
    <!-- Include Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #f5f6f7;
            --button-color: #2481cc;
            --button-text-color: #ffffff;
            --input-bg: #202b36;
            --input-border: #2f3e4e;
            --hint-color: #7f91a4;
        }

        /* Adjust colors based on Telegram Theme if available */
        body.telegram {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f6f7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, var(--hint-color));
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Aligned Heights and Box Sizing */
        input[type="text"],
        #date-input {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, var(--input-bg));
            border: 1px solid var(--tg-theme-hint-color, var(--input-border));
            color: var(--tg-theme-text-color, var(--text-color));
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        select {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, var(--input-bg));
            border: 1px solid var(--tg-theme-hint-color, var(--input-border));
            color: var(--tg-theme-text-color, var(--text-color));
            border-radius: 10px;
            padding: 12px;
            padding-right: 40px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        input[type="text"]:focus,
        #date-input:focus,
        select:focus {
            border-color: var(--tg-theme-button-color, var(--button-color));
        }

        /* Stepper Height Alignment */
        .stepper {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, var(--input-bg));
            border: 1px solid var(--tg-theme-hint-color, var(--input-border));
            color: var(--tg-theme-text-color, var(--text-color));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .stepper-btn {
            background-color: transparent;
            border: none;
            color: var(--tg-theme-button-color, var(--button-color));
            font-size: 24px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .stepper-btn:active:not(:disabled) {
            opacity: 0.6;
        }

        .stepper-btn:disabled {
            color: var(--tg-theme-hint-color, var(--hint-color));
            cursor: not-allowed;
        }

        .stepper-value {
            font-size: 18px;
            font-weight: 600;
            width: 60px;
            text-align: center;
        }

        /* Submit Button */
        .submit-btn {
            background-color: var(--tg-theme-button-color, var(--button-color));
            color: var(--tg-theme-button-text-color, var(--button-text-color));
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            outline: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: opacity 0.2s;
        }

        .submit-btn:active {
            opacity: 0.85;
        }

        .error-message {
            color: #ff595a;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        /* Custom Calendar Popup */
        #calendar-popup {
            display: none;
            position: absolute;
            top: 75px;
            left: 0;
            right: 0;
            background-color: var(--tg-theme-secondary-bg-color, var(--input-bg));
            border: 1px solid var(--tg-theme-hint-color, var(--input-border));
            border-radius: 12px;
            z-index: 1000;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Add Movie Reservation</h2>

    <!-- Movie Title (with Suggestions Datalist) -->
    <div class="form-group">
        <label for="title">Movie Title</label>
        <input type="text" id="title" placeholder="Enter or select movie title" list="movie-suggestions" required autocomplete="off">
        <datalist id="movie-suggestions">
            <!-- Dynamic options populated from query params -->
        </datalist>
        <div id="title-error" class="error-message">⚠️ Movie title cannot be empty.</div>
    </div>

    <!-- Date (Custom Calendar Input with Reset Button) -->
    <div class="form-group">
        <label for="date-input">Date (Optional)</label>
        <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input type="text" id="date-input" readonly value="ANY DATE" style="cursor: pointer; padding-right: 40px;">
            <button type="button" id="reset-date-btn" style="position: absolute; right: 10px; background: transparent; border: none; color: var(--tg-theme-hint-color, var(--hint-color)); font-size: 18px; cursor: pointer; display: none;">✕</button>
        </div>
        
        <!-- Custom Calendar Overlay -->
        <div id="calendar-popup">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <button type="button" id="prev-month-btn" style="background: transparent; border: none; color: var(--tg-theme-button-color, var(--button-color)); font-size: 18px; cursor: pointer; padding: 4px 8px;">◀</button>
                <span id="calendar-month-year" style="font-weight: 600; font-size: 15px;"></span>
                <button type="button" id="next-month-btn" style="background: transparent; border: none; color: var(--tg-theme-button-color, var(--button-color)); font-size: 18px; cursor: pointer; padding: 4px 8px;">▶</button>
            </div>
            <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 13px;">
                <!-- Days header (Su, Mo, ...) then dates -->
            </div>
        </div>
    </div>

    <!-- Time Selector -->
    <div class="form-group">
        <label for="time">Time (Hour)</label>
        <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <select id="time">
                <!-- Hours 0 to 23 -->
            </select>
            <div style="position: absolute; right: 14px; pointer-events: none; display: flex; align-items: center; justify-content: center; height: 100%;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--tg-theme-hint-color, var(--hint-color));">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <!-- Seats Stepper -->
    <div class="form-group">
        <label>Seats (People)</label>
        <div class="stepper">
            <button type="button" id="stepper-minus" class="stepper-btn" onclick="adjustSeats(-1)">−</button>
            <span class="stepper-value" id="seats-value">1</span>
            <button type="button" id="stepper-plus" class="stepper-btn" onclick="adjustSeats(1)">+</button>
        </div>
    </div>

    <!-- Submit -->
    <button type="button" class="submit-btn" onclick="submitForm()">Add to List</button>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Initialize and apply theme
        tg.ready();
        tg.expand(); // Expand the webapp to full screen height
        
        if (tg.colorScheme === 'dark' || tg.colorScheme === 'light') {
            document.body.classList.add('telegram');
        }

        // 1. Populate Movie Suggestions from URL Query Param
        const urlParams = new URLSearchParams(window.location.search);
        const moviesQuery = urlParams.get('movies');
        if (moviesQuery) {
            try {
                const movies = decodeURIComponent(moviesQuery).split(',');
                const datalist = document.getElementById('movie-suggestions');
                movies.forEach(movie => {
                    if (movie.trim()) {
                        const option = document.createElement('option');
                        option.value = movie.trim();
                        datalist.appendChild(option);
                    }
                });
            } catch (e) {
                console.error("Failed to parse movie suggestions:", e);
            }
        }

        // 2. Populate Time Selector (0 to 23)
        const timeSelect = document.getElementById('time');
        for (let h = 0; h <= 23; h++) {
            const option = document.createElement('option');
            option.value = h;
            option.textContent = `${h.toString().padStart(2, '0')}:00`;
            if (h === 12) option.selected = true; // Default to 12:00
            timeSelect.appendChild(option);
        }

        // 3. Seats Stepper logic (Default set to 1)
        let seats = 1;
        const seatsValEl = document.getElementById('seats-value');
        const minusBtn = document.getElementById('stepper-minus');
        const plusBtn = document.getElementById('stepper-plus');
        
        function updateStepperButtons() {
            minusBtn.disabled = (seats === 1);
            plusBtn.disabled = (seats === 8);
        }

        function adjustSeats(amount) {
            seats = Math.max(1, Math.min(8, seats + amount)); // Limit seats between 1 and 8
            seatsValEl.textContent = seats;
            updateStepperButtons();
        }
        updateStepperButtons(); // Initial call

        // 4. Custom Calendar Logic
        let currentDate = new Date();
        let selectedDate = null; // Store selected Date object, null for ANY DATE

        const dateInput = document.getElementById('date-input');
        const resetDateBtn = document.getElementById('reset-date-btn');
        const calendarPopup = document.getElementById('calendar-popup');
        const calendarMonthYear = document.getElementById('calendar-month-year');
        const calendarGrid = document.getElementById('calendar-grid');

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

        function updateDateInputColor() {
            if (dateInput.value === "ANY DATE") {
                dateInput.style.color = "var(--tg-theme-hint-color, var(--hint-color))";
            } else {
                dateInput.style.color = "";
            }
        }
        updateDateInputColor();

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            // Render Day Headers (Su, Mo, Tu...)
            dayNames.forEach(day => {
                const header = document.createElement('div');
                header.textContent = day;
                header.style.color = 'var(--tg-theme-hint-color, var(--hint-color))';
                header.style.fontWeight = '500';
                header.style.paddingBottom = '6px';
                calendarGrid.appendChild(header);
            });

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            calendarMonthYear.textContent = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            // Render Blank Days for layout spacing
            for (let i = 0; i < firstDay; i++) {
                const blank = document.createElement('div');
                calendarGrid.appendChild(blank);
            }
            
            // Render Days
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.textContent = day;
                dayCell.style.cursor = 'pointer';
                dayCell.style.padding = '8px 0';
                dayCell.style.borderRadius = '8px';
                dayCell.style.transition = 'background 0.15s, color 0.15s';
                
                // Hover effect
                dayCell.addEventListener('mouseenter', () => {
                    if (!dayCell.classList.contains('selected')) {
                        dayCell.style.backgroundColor = 'var(--input-border)';
                    }
                });
                dayCell.addEventListener('mouseleave', () => {
                    if (!dayCell.classList.contains('selected')) {
                        dayCell.style.backgroundColor = 'transparent';
                    }
                });

                // Check if this cell is currently selected
                if (selectedDate && 
                    selectedDate.getFullYear() === year && 
                    selectedDate.getMonth() === month && 
                    selectedDate.getDate() === day) {
                    dayCell.classList.add('selected');
                    dayCell.style.backgroundColor = 'var(--tg-theme-button-color, var(--button-color))';
                    dayCell.style.color = 'var(--tg-theme-button-text-color, var(--button-text-color))';
                    dayCell.style.fontWeight = '600';
                }
                
                dayCell.addEventListener('click', () => {
                    selectDate(new Date(year, month, day));
                });
                
                calendarGrid.appendChild(dayCell);
            }
        }

        function selectDate(date) {
            selectedDate = date;
            dateInput.value = formatShowDate(date);
            resetDateBtn.style.display = 'block';
            calendarPopup.style.display = 'none';
            updateDateInputColor();
        }

        function resetDate() {
            selectedDate = null;
            dateInput.value = "ANY DATE";
            resetDateBtn.style.display = 'none';
            calendarPopup.style.display = 'none';
            updateDateInputColor();
        }

        function formatShowDate(d) {
            const day = d.getDate();
            const month = monthNames[d.getMonth()];
            const year = d.getFullYear();
            return `${month} ${day}, ${year}`;
        }

        function formatValueDate(d) {
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear();
            return `${year}-${month}-${day}`;
        }

        // Navigation
        document.getElementById('prev-month-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Show/Hide Calendar dropdown
        dateInput.addEventListener('click', (e) => {
            e.stopPropagation();
            const isVisible = calendarPopup.style.display === 'block';
            calendarPopup.style.display = isVisible ? 'none' : 'block';
            if (!isVisible) {
                renderCalendar();
            }
        });

        resetDateBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetDate();
        });

        // Dismiss calendar when clicking outside
        document.addEventListener('click', (event) => {
            if (!calendarPopup.contains(event.target) && !dateInput.contains(event.target) && !resetDateBtn.contains(event.target)) {
                calendarPopup.style.display = 'none';
            }
        });

        // 5. Form Submission
        function submitForm() {
            const titleInput = document.getElementById('title');
            const title = titleInput.value.trim();
            const date = selectedDate ? formatValueDate(selectedDate) : "";
            const time = parseInt(document.getElementById('time').value);

            if (!title) {
                document.getElementById('title-error').style.display = 'block';
                titleInput.focus();
                return;
            } else {
                document.getElementById('title-error').style.display = 'none';
            }

            const payload = {
                title: title,
                date: date, // YYYY-MM-DD or empty string
                time: time,
                people: seats
            };

            // Send data back to telegram bot and close webapp
            tg.sendData(JSON.stringify(payload));
            tg.close();
        }
    </script>
</body>
</html>
