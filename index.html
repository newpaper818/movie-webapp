<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Movie Reservations</title>
    <!-- Include Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Dynamic Movies will be rendered here -->
        <div id="movies-container"></div>

        <!-- Spacer Box -->
        <div class="spacer"></div>

        <!-- Global Bottom Buttons -->
        <div class="bottom-bar">
            <button type="button" class="btn-bottom btn-add-movie" id="btn-add-movie-action">Add new movie</button>
            <button type="button" class="btn-bottom btn-save" id="btn-save-action">Save</button>
        </div>

        <!-- Global Custom Calendar Dropdown -->
        <div id="calendar-popup">
            <div class="calendar-header">
                <button type="button" id="prev-month-btn">◀</button>
                <span class="calendar-month-year" id="calendar-month-year"></span>
                <button type="button" id="next-month-btn">▶</button>
            </div>
            <div class="calendar-header" style="justify-content: center; margin-top: -6px; margin-bottom: 6px;">
                <button type="button" id="calendar-reset-btn" style="font-size: 14px; color: var(--gray-text);">Anydate (Reset)</button>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- Header days then dates -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
